# Posts each new FISCHXR version to the Discord updates channel.
# Needs the repository secret DISCORD_WEBHOOK (the channel's webhook address).
# Optional: the secret DISCORD_ROLE (a role ID) to ping that role.
name: Announce update on Discord
on:
  push:
    branches: [main]
    paths: [update.json]
  workflow_dispatch:
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Post the new version to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE: ${{ secrets.DISCORD_ROLE }}
        run: python3 .github/scripts/announce.py
